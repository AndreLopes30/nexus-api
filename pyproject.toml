[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["frontend/node_modules"]

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates Depends(...) while building its dependency graph.
"app/api/endpoints/*.py" = ["B008"]
"app/core/security.py" = ["B008"]
